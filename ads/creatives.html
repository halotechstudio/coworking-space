<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HALO · Coworking Space ad creatives</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=block" rel="stylesheet">
<!--
  Render one creative per page load:  creatives.html?c=offer&f=feed
  c = offer | pain | brand | features      f = feed (1080x1350) | story (1080x1920)
-->
<style>
  :root{
    --ink:#15171a; --w:#fff; --w2:rgba(255,255,255,.78); --w3:rgba(255,255,255,.55);
    --signal:#ff5b2e; --violet:#6a4cf5;
    --chrome:linear-gradient(180deg,#ffffff 0%,#e4e7ea 42%,#a9afb6 52%,#f3f4f6 78%,#c9cdd2 100%);
    --sans:'Geist',system-ui,sans-serif; --mono:'Geist Mono',ui-monospace,monospace;
    --W:1080px; --H:1350px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:var(--W);height:var(--H);overflow:hidden;background:#1b1e22}
  body.story{--H:1920px}
  .ad{position:relative;width:var(--W);height:var(--H);overflow:hidden;font-family:var(--sans);color:var(--w);-webkit-font-smoothing:antialiased;
    background:radial-gradient(85% 60% at 50% 4%,#5d646b 0%,#33393f 48%,#1b1e22 100%)}
  /* LED dot field */
  .ad::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.32) 1.4px,transparent 2.1px);background-size:22px 22px;
    -webkit-mask-image:radial-gradient(70% 55% at 50% 62%,#000 0%,transparent 78%);mask-image:radial-gradient(70% 55% at 50% 62%,#000 0%,transparent 78%);opacity:.55}
  /* violet product glow behind devices */
  .glow{position:absolute;left:50%;width:1100px;height:900px;translate:-50% 0;background:radial-gradient(closest-side,rgba(106,76,245,.55),rgba(106,76,245,.12) 55%,transparent);filter:blur(10px)}
  .ring{position:absolute;left:50%;translate:-50% 0;width:900px;height:900px;border-radius:50%;border:1.5px solid rgba(255,255,255,.28);
    box-shadow:0 0 60px 6px rgba(255,255,255,.08),inset 0 0 60px 6px rgba(255,255,255,.05)}
  .beads{position:absolute;left:50%;translate:-50% 0;width:980px;height:980px}

  .top{position:absolute;left:72px;right:72px;top:64px;display:flex;justify-content:space-between;align-items:center;z-index:5}
  .logo{display:flex;align-items:center;gap:14px;font-weight:600;letter-spacing:.32em;font-size:26px}
  .logo svg{width:40px;height:40px}
  .tag{font-family:var(--mono);font-size:20px;letter-spacing:.16em;text-transform:uppercase;color:var(--w2);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:12px 22px;background:rgba(255,255,255,.06)}

  .head{position:absolute;left:72px;right:72px;z-index:5}
  h1{font-weight:500;font-size:92px;line-height:.98;letter-spacing:-.04em}
  h1 .chrome{background:var(--chrome);-webkit-background-clip:text;background-clip:text;color:transparent}
  h1 .soft{color:var(--w3)}
  .sub{margin-top:26px;font-size:32px;line-height:1.35;color:var(--w2);max-width:860px;font-weight:400}

  /* devices */
  .phone{position:absolute;width:var(--pw,330px);aspect-ratio:780/1688;border-radius:calc(var(--pw,330px)*.14);padding:calc(var(--pw,330px)*.028);
    background:linear-gradient(160deg,#8b9198,#2b2f34 30%,#111316 70%,#5a6067);box-shadow:0 50px 90px -20px rgba(0,0,0,.75),0 0 0 1.5px rgba(255,255,255,.12) inset;z-index:3}
  .phone img{display:block;width:100%;height:100%;object-fit:cover;border-radius:calc(var(--pw,330px)*.115)}
  .phone::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(120deg,rgba(255,255,255,.16),transparent 30%);pointer-events:none}
  .desk{position:absolute;width:var(--dw,760px);border-radius:22px;overflow:hidden;background:#0b0c0e;box-shadow:0 40px 90px -20px rgba(0,0,0,.8);border:1.5px solid rgba(255,255,255,.16);z-index:2}
  .desk .bar{height:34px;display:flex;align-items:center;gap:9px;padding:0 16px;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.03));border-bottom:1px solid rgba(255,255,255,.1)}
  .desk .bar i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.3)} .desk .bar i:first-child{background:#fff}
  .desk img{display:block;width:100%}

  /* offer + CTA */
  .deal{position:absolute;left:72px;right:72px;z-index:6;display:flex;align-items:center;gap:22px;padding:26px 28px;border-radius:28px;
    background:rgba(21,23,26,.72);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
  .price{font-weight:600;font-size:66px;letter-spacing:-.03em;line-height:1}
  .price small{font-size:26px;font-weight:400;color:var(--w2);letter-spacing:0;margin-left:4px}
  .terms{font-size:25px;line-height:1.35;color:var(--w2)}
  .terms b{color:#fff;font-weight:600}
  .cta{margin-left:auto;white-space:nowrap;font-weight:600;font-size:28px;color:var(--ink);background:#fff;border-radius:999px;padding:22px 32px;display:flex;align-items:center;gap:12px}
  .cta span{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;font-size:22px}
  .badge{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);font-size:21px;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--signal);border-radius:999px;padding:12px 20px;font-weight:500}
  .badge i{width:9px;height:9px;border-radius:50%;background:#fff}

  /* concept specifics */
  .pains{list-style:none;margin-top:34px;display:grid;gap:14px}
  .pains li{font-size:34px;color:var(--w3);display:flex;align-items:center;gap:18px}
  .pains li s{text-decoration-color:var(--signal);text-decoration-thickness:4px}
  .pains li b{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:rgba(255,91,46,.16);color:var(--signal);font-size:24px}
  .chips{position:absolute;inset:0;z-index:4}
  .chip{position:absolute;display:flex;align-items:center;gap:12px;font-size:27px;font-weight:500;padding:16px 22px;border-radius:999px;
    background:rgba(21,23,26,.74);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.18);box-shadow:0 18px 40px -12px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.14);white-space:nowrap}
  .chip i{width:12px;height:12px;border-radius:50%;background:#b8aef7;box-shadow:0 0 12px #b8aef7}
  .swatch{position:absolute;z-index:4;font-family:var(--mono);font-size:20px;letter-spacing:.1em;text-transform:uppercase;color:var(--w2);display:flex;align-items:center;gap:10px}
  .swatch i{width:18px;height:18px;border-radius:50%}
</style>
</head>
<body>
<div class="ad" id="ad"></div>

<script>
const q = new URLSearchParams(location.search);
const C = q.get('c') || 'offer', F = q.get('f') || 'feed', story = F === 'story';
if (story) document.body.classList.add('story');
const H = story ? 1920 : 1350;
const A = 'assets/';

const logo = `<div class="logo"><svg viewBox="0 0 24 24"><g fill="#eef0f2"><circle cx="12" cy="2.6" r="2.1"/><circle cx="16.7" cy="3.9" r="1.3"/><circle cx="20.1" cy="7.3" r="1.3"/><circle cx="21.4" cy="12" r="1.3"/><circle cx="20.1" cy="16.7" r="1.3"/><circle cx="16.7" cy="20.1" r="1.3"/><circle cx="12" cy="21.4" r="1.3"/><circle cx="7.3" cy="20.1" r="1.3"/><circle cx="3.9" cy="16.7" r="1.3"/><circle cx="2.6" cy="12" r="1.3"/><circle cx="3.9" cy="7.3" r="1.3"/><circle cx="7.3" cy="3.9" r="1.3"/></g></svg>HALO</div>`;
const beads = (top) => {
  let s = `<svg class="beads" style="top:${top}px" viewBox="0 0 200 200">`;
  for (let i = 0; i < 64; i++) { const a = i / 64 * Math.PI * 2 - Math.PI / 2, lit = Math.max(0, 1 - Math.abs(i - 8) / 12);
    s += `<circle cx="${(100 + Math.cos(a) * 96).toFixed(2)}" cy="${(100 + Math.sin(a) * 96).toFixed(2)}" r="${i === 0 ? 1.6 : 1}" fill="#fff" opacity="${(0.15 + lit * .85).toFixed(2)}"/>`; }
  return s + '</svg>';
};
const phone = (img, x, y, w, rot = 0, z = 3) => `<div class="phone" style="left:${x}px;top:${y}px;--pw:${w}px;rotate:${rot}deg;z-index:${z}"><img src="${A}${img}.webp"></div>`;
const desk = (img, x, y, w, rot = 0) => `<div class="desk" style="left:${x}px;top:${y}px;--dw:${w}px;rotate:${rot}deg"><div class="bar"><i></i><i></i><i></i></div><img src="${A}${img}.webp"></div>`;
const deal = (y, line) => `<div class="deal" style="top:${y}px"><div><div class="price">₹1.49L</div></div><div class="terms">${line}</div><div class="cta">Get the demo <span>→</span></div></div>`;

let html = `<div class="top">${logo}<span class="tag">Coworking app</span></div>`;
// vertical rhythm per format: story keeps text out of the top ~250px and bottom ~340px UI zones
const T = story ? 260 : 170, DEAL = story ? 1500 : 1166;

if (C === 'offer') {
  html += `<div class="head" style="top:${T}px"><span class="badge"><i></i>Live in 3 weeks</span>
    <h1 style="margin-top:28px">Your own <span class="chrome">coworking app.</span><br><span class="soft">Built for your space.</span></h1></div>`;
  const dy = story ? 820 : 640;
  html += `<div class="glow" style="top:${dy - 120}px"></div><div class="ring" style="top:${dy - 160}px"></div>${beads(dy - 200)}`;
  html += desk('admin-dash', 150, dy + 10, 780, 0);
  html += phone('manager-floor', 70, dy + 90, 250, -7, 3) + phone('member-home', 760, dy + 70, 260, 6, 4);
  html += deal(DEAL, '<b>Member, manager &amp; admin apps</b><br>Your brand · iOS, Android, web');
}

if (C === 'pain') {
  html += `<div class="head" style="top:${T}px"><h1>Still running your space on <span class="chrome">WhatsApp and Excel?</span></h1>
    <ul class="pains"><li><b>✕</b><s>Visitor register on paper</s></li><li><b>✕</b><s>Room bookings over chat</s></li><li><b>✕</b><s>Chasing dues every month</s></li></ul></div>`;
  const dy = story ? 1000 : 700;
  html += `<div class="glow" style="top:${dy - 160}px"></div>`;
  html += phone('manager-guests', 120, dy, 270, -6, 3) + phone('member-book', 405, dy - 40, 280, 0, 4) + phone('member-wallet', 700, dy, 270, 6, 3);
  html += deal(DEAL, '<b>Members, staff &amp; billing</b><br>Your brand · live in 3 weeks');
}

if (C === 'brand') {
  html += `<div class="head" style="top:${T}px"><h1>Your brand.<br><span class="chrome">Our engine.</span></h1>
    <p class="sub">Your name and colours. Live in 3 weeks.</p></div>`;
  const dy = story ? 880 : 610;
  html += `<div class="glow" style="top:${dy - 120}px"></div><div class="ring" style="top:${dy - 140}px"></div>${beads(dy - 180)}`;
  html += phone('home-orange', 95, dy + 40, 270, -6, 3) + phone('member-home', 405, dy, 280, 0, 4) + phone('home-green', 715, dy + 40, 270, 6, 3);
  html += deal(DEAL, '<b>3 apps, one fixed price</b><br>iOS, Android and web');
}

if (C === 'features') {
  html += `<div class="head" style="top:${T}px"><h1>Everything your space runs on. <span class="chrome">One app.</span></h1></div>`;
  const dy = story ? 860 : 560;
  html += `<div class="glow" style="top:${dy - 80}px"></div><div class="ring" style="top:${dy - 100}px"></div>${beads(dy - 140)}`;
  html += phone('member-home', 375, dy, 330, 0, 3);
  const c = (t, x, y) => `<div class="chip" style="left:${x}px;top:${y}px"><i></i>${t}</div>`;
  html += `<div class="chips">${c('Desk &amp; room booking', 70, dy + 60)}${c('QR door pass', 760, dy + 120)}${c('GST invoices', 90, dy + 280)}${c('Visitor approvals', 730, dy + 340)}${c('Events &amp; RSVPs', 110, dy + 440)}${c('Multi-branch dashboard', 620, dy + 480)}</div>`;
  html += deal(DEAL, '<b>Live in 3 weeks</b><br>Under your own brand');
}

document.getElementById('ad').innerHTML = html;
</script>
</body>
</html>
